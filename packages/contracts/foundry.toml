[profile.default]
src      = 'src'
out      = 'out'
libs     = ['lib']
solc_version   = '0.8.26'
optimizer      = true
optimizer_runs = 200
remappings = [
  "openzeppelin-contracts/=lib/openzeppelin-contracts/"
]

# Fork tests use this RPC (set CELO_RPC_URL in .env or environment)
# Example: export CELO_RPC_URL=https://forno.celo.org
[rpc_endpoints]
celo = "${CELO_RPC_URL}"

[fuzz]
runs = 500

[invariant]
runs = 128

[fmt]
line_length = 120

