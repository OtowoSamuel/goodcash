name = "goodcash-orders"
main = "src/index.ts"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]

# KV namespace binding — set up "ORDER_STORE" in CF dashboard
# or via `wrangler kv:namespace create ORDER_STORE`
# and replace c7897f6e178b431d99d7fef60dd0c81e with the real ID before deploy
[[kv_namespaces]]
binding = "ORDER_STORE"
id = "c7897f6e178b431d99d7fef60dd0c81e"

# Secrets — set via `wrangler secret put PAYCREST_API_KEY` etc.
# Never put real values in this file.
# Rate limiting without storage writes (30 requests per minute per visitor and endpoint)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_READ"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_STRICT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# Every 10 minutes: look for payouts that are taking too long and tell the team
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

[vars]
# Production-only origins. Dev origins live in [env.development.vars] so they
# are never shipped to production.
RESEND_FROM = "GoodCash <hello@goodcash.xyz>"
PAYCREST_BASE_URL = "https://api.paycrest.io"
CELO_RPC_URL = "https://forno.celo.org"
VERIFY_SWAP_ONCHAIN = "true"
RATE_LIMIT_MAX = "30"
RATE_LIMIT_WINDOW_SECONDS = "60"
ALLOWED_ORIGINS = "https://goodcash.pages.dev,https://goodcash-1e6.pages.dev,https://onetap-test.goodcash-1e6.pages.dev,https://magic-test.goodcash-1e6.pages.dev,https://goodcash.xyz,https://www.goodcash.xyz"
# One-tap router (owned by the GoodCash Safe). The app only uses it on builds that also set VITE_ROUTER_V2_ADDRESS.
ROUTER_V2_ADDRESS = "0x546698368a246539Df5e641EdC2b79c5782ea359"
ROUTER_V2_DEPLOY_BLOCK = "82237765"
# GoodCash fee: a percent of each cash out, paid out through the payout partner to the GoodCash Safe (public address).
# Remove SENDER_FEE_PERCENT (or set it to "0") to stop charging. The app shows the fee only when its own
# VITE_GOODCASH_FEE_PERCENT matches this, so deploy either order (the server charges only when the screen showed the fee).
SENDER_FEE_PERCENT = "1"
SENDER_FEE_ADDRESS = "0x735Ef948F746bc141D04042d2A18aA7f967bce2f"

[env.development.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://goodcash.pages.dev,https://goodcash-1e6.pages.dev,https://goodcash.xyz,https://www.goodcash.xyz"
