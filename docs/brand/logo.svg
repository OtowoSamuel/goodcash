<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#cdb8ff"/>
  <!-- coin shadow -->
  <g transform="rotate(12 256 240)">
    <circle cx="270" cy="254" r="128" fill="#111"/>
    <circle cx="256" cy="240" r="128" fill="#ffd23f" stroke="#111" stroke-width="16"/>
    <circle cx="256" cy="240" r="92" fill="none" stroke="#111" stroke-width="8" stroke-dasharray="2 18" stroke-linecap="round"/>
    <text x="256" y="276" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="104" fill="#111">G$</text>
  </g>
  <!-- naira sticker -->
  <g transform="rotate(-6 384 408)">
    <rect x="300" y="360" width="176" height="96" rx="28" fill="#111" transform="translate(10 10)"/>
    <rect x="300" y="360" width="176" height="96" rx="28" fill="#7b39fc" stroke="#111" stroke-width="12"/>
    <text x="388" y="428" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="64" fill="#fff">₦</text>
  </g>
