<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <clipPath id="c"><rect width="1500" height="500"/></clipPath>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="3" fill="#b79cf5"/></pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1500" height="500" fill="#cdb8ff"/>
    <rect width="1500" height="500" fill="url(#dots)"/>

    <!-- logo tile -->
    <svg x="64" y="70" width="360" height="360" viewBox="0 0 512 512">
      <rect x="34" y="34" width="464" height="464" rx="112" fill="#111"/>
      <rect x="20" y="20" width="464" height="464" rx="112" fill="#cdb8ff" stroke="#111" stroke-width="16"/>
      <circle cx="330" cy="196" r="104" fill="#111" transform="translate(12 12)"/>
      <circle cx="330" cy="196" r="104" fill="#7b39fc" stroke="#111" stroke-width="16"/>
      <path d="M262 150a96 96 0 0 1 52-40" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".55"/>
      <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M298 236V158L362 236V158" stroke-width="22"/>
        <path d="M280 187H380M280 211H380" stroke-width="13"/>
      </g>
      <circle cx="196" cy="320" r="128" fill="#111" transform="translate(14 14)"/>
      <circle cx="196" cy="320" r="128" fill="#ffd23f" stroke="#111" stroke-width="18"/>
      <g transform="translate(196 320) scale(1.1) translate(-192 -292)">
        <path d="M112 262a90 90 0 0 1 52-52" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
        <path d="M234 258 A52 52 0 1 0 244 296 H196" fill="none" stroke="#111" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>

    <!-- words -->
    <text x="462" y="232" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="132" letter-spacing="-3" fill="#111">GoodCash</text>
    <text x="466" y="302" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="38" fill="#111">Turn your G$ into naira, straight to your bank.</text>

    <!-- chips -->
    <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="26">
      <g transform="translate(466 342)"><rect x="6" y="6" width="214" height="56" rx="18" fill="#111"/><rect width="214" height="56" rx="18" fill="#fff" stroke="#111" stroke-width="5"/><text x="107" y="37" text-anchor="middle" fill="#111">Non-custodial</text></g>
      <g transform="translate(704 342)"><rect x="6" y="6" width="176" height="56" rx="18" fill="#111"/><rect width="176" height="56" rx="18" fill="#ffd23f" stroke="#111" stroke-width="5"/><text x="88" y="37" text-anchor="middle" fill="#111">On Celo</text></g>
      <g transform="translate(906 342)"><rect x="6" y="6" width="272" height="56" rx="18" fill="#111"/><rect width="272" height="56" rx="18" fill="#7b39fc" stroke="#111" stroke-width="5"/><text x="136" y="37" text-anchor="middle" fill="#fff">One confirmation</text></g>
    </g>

    <!-- coins bleeding off the right edge -->
    <g>
      <circle cx="1410" cy="125" r="104" fill="#111" transform="translate(12 12)"/>
      <circle cx="1410" cy="125" r="104" fill="#7b39fc" stroke="#111" stroke-width="12"/>
      <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1378 165V87L1442 165V87" stroke-width="20"/>
        <path d="M1360 116H1460M1360 140H1460" stroke-width="12"/>
      </g>
      <circle cx="1410" cy="405" r="92" fill="#111" transform="translate(12 12)"/>
      <circle cx="1410" cy="405" r="92" fill="#ffd23f" stroke="#111" stroke-width="12"/>
      <path d="M1356 372 A38 38 0 1 0 1362 400 H1332" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(74 18)"/>
      <circle cx="1196" cy="70" r="26" fill="#ffd23f" stroke="#111" stroke-width="8"/>
      <circle cx="1290" cy="462" r="18" fill="#7b39fc" stroke="#111" stroke-width="7"/>
    </g>
  </g>
</svg>
